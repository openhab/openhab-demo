### Main UI Overview Page

version: 1
pages:
  overview:
    tags: []
    props:
      parameters: []
      parameterGroups: []
    component: oh-layout-page
    config:
      label: Overview
    slots:
      canvas: []
      default:
        - component: oh-block
          config:
            title: Presence & Alarm
          slots:
            default:
              - component: oh-grid-row
                config: {}
                slots:
                  default:
                    - component: oh-grid-col
                      config: {}
                      slots:
                        default:
                          - component: oh-label-card
                            config:
                              action: popup
                              actionModal: widget:keypad
                              actionModalConfig:
                                closePopup: true
                                hint: The PIN code is 1234.
                                item: Presence
                                mask: "*"
                                rule: disarm-alarmsystem-by-pin
                              background: "=(items.Presence.state === 'ON') ? '#00cc00' : '#007700aa'"
                              class:
                                - text-color-white
                              label: Home
                    - component: oh-grid-col
                      config: {}
                      slots:
                        default:
                          - component: oh-label-card
                            config:
                              action: command
                              actionCommand: OFF
                              actionItem: Presence
                              background: "=(items.Presence.state === 'OFF') ? '#cc0000' : '#770000aa'"
                              class:
                                - text-color-white
                              label: Away
        - component: oh-block
          config:
            title: General Scenes
          slots:
            default:
              - component: oh-grid-cells
                config: {}
                slots:
                  default:
                    - component: oh-cell
                      config:
                        action: rule
                        actionFeedback: Scene activated!
                        actionRule: Morning
                        color: yellow
                        header: Activate scene
                        icon: f7:sunrise
                        on: true
                        title: Morning
                    - component: oh-cell
                      config:
                        action: rule
                        actionFeedback: Scene activated!
                        actionRule: Work
                        color: lime
                        header: Activate scene
                        icon: f7:device_laptop
                        on: true
                        subtitle: Office
                        title: Reading
                    - component: oh-cell
                      config:
                        action: rule
                        actionFeedback: Scene activated!
                        actionRule: TV
                        color: deeporange
                        header: Activate scene
                        icon: f7:tv
                        on: true
                        subtitle: Living Room
                        title: TV
                    - component: oh-cell
                      config:
                        action: rule
                        actionFeedback: Scene activated!
                        actionRule: Diner
                        color: red
                        header: Activate scene
                        icon: f7:poultry_leg
                        on: true
                        subtitle: Living Room
                        title: Dinner
                    - component: oh-cell
                      config:
                        action: rule
                        actionFeedback: Scene activated!
                        actionRule: Night
                        color: deeppurple
                        header: Activate scene
                        icon: f7:moon_zzz
                        on: "true"
                        title: Night
              - component: oh-grid-row
                config: {}
                slots:
                  default:
                    - component: oh-grid-col
                      config: {}
                      slots:
                        default:
                          - component: widget:internalLink
                            config:
                              link: /settings/scenes/
                              text: "Tip: You can check out the above scenes on the Scenes Settings page."
        - component: oh-block
          config:
            title: Other Pages
          slots:
            default:
              - component: oh-grid-row
                config: {}
                slots:
                  default:
                    - component: oh-grid-col
                      config:
                        large: "25"
                        small: "50"
                        width: "100"
                      slots:
                        default:
                          - component: oh-label-card
                            config:
                              action: navigate
                              actionPage: page:EMS
                              actionPageTransition: f7-dive
                              footer: A typical layout
                              icon: f7:bolt_circle
                              label: EMS
                              vertical: true
                    - component: oh-grid-col
                      config:
                        large: "25"
                        small: "50"
                        width: "100"
                      slots:
                        default:
                          - component: oh-label-card
                            config:
                              action: navigate
                              actionPage: page:chart_tabs
                              actionPageTransition: f7-dive
                              footer: 6 types in tabs
                              icon: f7:graph_circle
                              label: Charts
                              vertical: true
                    - component: oh-grid-col
                      config:
                        large: "25"
                        small: "50"
                        width: "100"
                      slots:
                        default:
                          - component: oh-label-card
                            config:
                              action: navigate
                              actionPage: page:positions
                              actionPageTransition: f7-cover-v
                              footer: Where are the kids?
                              icon: f7:map
                              label: Map
                              vertical: true
                    - component: oh-grid-col
                      config:
                        large: "25"
                        small: "50"
                        width: "100"
                      slots:
                        default:
                          - component: oh-label-card
                            config:
                              action: navigate
                              actionPage: page:floorplan
                              actionPageTransition: f7-cover-v
                              footer: Visualise your home
                              icon: iconify:carbon:floorplan
                              label: Floorplan
                              vertical: true
                    - component: oh-grid-col
                      config:
                        large: "25"
                        small: "50"
                        width: "100"
                      slots:
                        default:
                          - component: oh-label-card
                            config:
                              action: popup
                              actionModal: page:languages
                              actionPageTransition: f7-circle
                              footer: Code in 6 languages
                              icon: f7:doc_circle
                              label: Scripts
                              vertical: true
      grid: []
      masonry: []
