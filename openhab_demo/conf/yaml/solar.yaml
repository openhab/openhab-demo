version: 1
items:
  gSolar:
    type: Group
    label: Solar Inverter
    tags:
      - Inverter
  # Use actual values from ForecastSolar along with some randomness to fake power values:
  Solar_Power_Total:
    type: Group
    group:
      type: Number
      dimension: Power
      function: SUM
    label: Total Power
    icon: solarplant
    format: '%.2f kW'
    unit: kW
    groups:
      - gSolar
    tags:
      - Measurement
      - Power
  Solar_Power_East:
    type: Number
    dimension: Power
    label: Plane East Power
    icon: solarplant
    format: '%.2f kW'
    unit: kW
    groups:
      - gSolar
      - Solar_Power_Total
      - EMS_Solar_Power
    tags:
      - Measurement
      - Power
    channels:
      solarforecast:fs-plane:local:east:power-actual:
        profile: transform:JS
        toItemScript: randomness.js?scale=0.2&min=0&forwardZero=true
  Solar_Power_West:
    type: Number
    dimension: Power
    label: Plane West Power
    icon: solarplant
    format: '%.2f kW'
    unit: kW
    groups:
      - gSolar
      - Solar_Power_Total
      - EMS_Solar_Power
    tags:
      - Measurement
      - Power
    channels:
      solarforecast:fs-plane:local:west:power-actual:
        profile: transform:JS
        toItemScript: randomness.js?scale=0.2&min=0&forwardZero=true
  # Calculated values:
  Solar_Production_Day:
    type: Number
    dimension: Energy
    label: Daily Production
    icon: solarplant
    format: '%.2f %unit%'
    unit: kWh
    groups:
      - gSolar
    tags:
      - Measurement
      - Energy
  Solar_Production_Month:
    type: Number
    dimension: Energy
    label: Monthly Production
    icon: solarplant
    format: '%.2f %unit%'
    unit: kWh
    groups:
      - gSolar
    tags:
      - Measurement
      - Energy

pages:
  Solar_Analytics_Power:
    tags: []
    props:
      parameters: []
      parameterGroups: []
    component: oh-chart-page
    config:
      chartType: day
      label: Solar Analytics
    slots:
      grid:
        - component: oh-chart-grid
          config: {}
      legend:
        - component: oh-chart-legend
          config:
            orient: horizontal
            show: true
            top: bottom
      series:
        - component: oh-time-series
          config:
            gridIndex: 0
            item: Solar_Forecast_Power_Estimate_Total
            name: Forecasted Power
            service: inmemory
            type: line
            xAxisIndex: 0
            yAxisIndex: 0
        - component: oh-time-series
          config:
            gridIndex: 0
            item: Solar_Power_Total
            name: Actual Power
            type: line
            xAxisIndex: 0
            yAxisIndex: 0
      tooltip:
        - component: oh-chart-tooltip
          config:
            confine: true
            orient: vertical
      xAxis:
        - component: oh-time-axis
          config:
            gridIndex: 0
      yAxis:
        - component: oh-value-axis
          config:
            gridIndex: 0
  Solar_Analytics_Month:
    tags: []
    props:
      parameters: []
      parameterGroups: []
    component: oh-chart-page
    config:
      chartType: month
      label: Solar Analytics
      sidebar: false
    slots:
      calendar:
        - component: oh-calendar-axis
          config:
            gridIndex: 0
            monthLabel:
              color: "#aaa"
              show: false
            orient: horizontal
            yearLabel:
              show: false
      grid: []
      series:
        - component: oh-calendar-series
          config:
            aggregationFunction: last
            calendarIndex: 0
            item: Solar_Production_Day
            label:
              color: "#000"
              formatter: =(params) => dayjs(params.value[0]).format('DD.MM.,') + '\n\n' + Math.round(params.value[1]) + ' kWh'
              show: true,
            name: Production
            service: influxdb
            type: heatmap
            z: 4
      toolbox: []
      tooltip:
        - component: oh-chart-tooltip
          config:
            confine: true
            orient: vertical
            show: true
      visualMap:
        - component: oh-chart-visualmap
          config:
            calculable: true
            height: 20%
            left: center
            max: "30"
            min: "0"
            orient: horizontal
            presetPalette: bluered
            show: true
            top: bottom
            type: continuous
      xAxis: []
      yAxis: []
  Solar_Analytics_Year:
    tags: []
    props:
      parameters: []
      parameterGroups: []
    component: oh-chart-page
    config:
      chartType: year
      label: Solar Analytics
    slots:
      grid:
        - component: oh-chart-grid
          config: {}
      series:
        - component: oh-aggregate-series
          config:
            aggregationFunction: last
            dimension1: month
            gridIndex: 0
            item: Solar_Production_Month
            name: Production
            service: influxdb
            type: bar
            xAxisIndex: 0
            yAxisIndex: 0
      tooltip:
        - component: oh-chart-tooltip
          config:
            confine: true
      xAxis:
        - component: oh-category-axis
          config:
            categoryType: year
            gridIndex: 0
            monthFormat: short
            weekdayFormat: short
      yAxis:
        - component: oh-value-axis
          config:
            gridIndex: 0
            min: "0"
            name: kWh
  Solar_Analytics:
    tags: []
    props:
      parameters: []
      parameterGroups: []
    component: oh-tabs-page
    config:
      label: Solar Analytics
    slots:
      default:
        - component: oh-tab
          config:
            icon: f7:calendar_today
            page: page:Solar_Analytics_Power
            title: Day
          slots:
            default: []
        - component: oh-tab
          config:
            icon: f7:calendar
            page: page:Solar_Analytics_Month
            title: Month
          slots:
            default: []
        - component: oh-tab
          config:
            icon: f7:calendar
            page: page:Solar_Analytics_Year
            title: Year
          slots:
            default: []
